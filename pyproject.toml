[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyweblight"
version = "0.0.6"
requires-python = ">=3.14"
authors = [
	{ name = "Mark Veltzer", email = "mark.veltzer@gmail.com" }
]
maintainers = [
	{ name = "Mark Veltzer", email = "mark.veltzer@gmail.com" }
]
description = "Pyweblight is a small configurable web server for developers"
readme = "README.md"
license = "MIT"
keywords=[
    "http",
    "https",
    "apache",
    "python",
    "python3",
    "server",
    "web",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "python-daemon",
    "pytconf",
    "pylogconf",
    "multipart",
]

[project.urls]
"Homepage" = "https://github.com/veltzer/pyweblight"
"Bug Tracker" = "https://github.com/veltzer/pyweblight/issues"
"Documentation" = "https://veltzer.github.io/pyweblight"
"Download" = "https://pypi.org/project/pyweblight/"
"Repository" = "https://github.com/veltzer/pyweblight"

[project.scripts]
pyweblight = "pyweblight.main:main"

[tool.pytest.ini_options]
# Every strictness check pytest has (strict_config, strict_markers,
# strict_xfail, strict_parametrization_ids), and every warning fails the
# test that raised it rather than scrolling past in the summary.
strict = true
filterwarnings = ["error"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/pyweblight"]

[tool.hatch.build.targets.sdist]
include = [
    "src/pyweblight/",
    "README.md",
    "LICENSE",
    "pyproject.toml"
]
exclude = [
    ".gitignore",
    ".github/",
    "tests/",
    "docs/",
    "config/",
    "*.md",
]

[tool.pyrefly]
# Type checking (rsconstruct's pyrefly processor), with pyrefly's default
# error set. "." on the search path is mypy's implicit current directory.
# Warnings fail the check like errors (pyrefly lets them pass by default).
min-severity = "warn"
python-version = "3.14"
search-path = [
    "src",
    ".",
]
# Third-party libraries without type information.
ignore-missing-imports = [
    "daemon.*",
    "multipart.*",
    "pylogconf.*",
    "pytconf.*",
]

[tool.pyrefly.errors]
no-any-return = "error"

[tool.hatch.envs.default]
installer = "uv"

[tool.uv.pip]
prerelease = "disallow"

[dependency-groups]
dev = [
    "pyrefly",
    "pytest",
    "python-multipart",
    "ruff",
    "sphinx",
]
